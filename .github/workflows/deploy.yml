name: Request Cloudflare build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger the native Cloudflare build
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Configure the CLOUDFLARE_DEPLOY_HOOK repository secret."
            exit 1
          fi
          node <<'JS'
          (async () => {
            const response = await fetch(process.env.DEPLOY_HOOK, {
              method: 'POST', signal: AbortSignal.timeout(30000),
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error('Cloudflare rejected the build request.');
            console.log('Cloudflare build requested:', result.result.build_uuid);
          })().catch(() => { console.error('Cloudflare build request failed.'); process.exitCode = 1; });
          JS
